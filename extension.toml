# Markdown: highlighting from Tree-sitter grammars compiled to WebAssembly
# (no code needed for that), and a preview, which is code: it asks the
# editor to render the document (`workbench::render-markdown`) and fills in
# a preview tab as you type. See "Previews" in Flareite's docs/extensions.md.
id = "flareite.markdown"
name = "Markdown"
version = "0.1.0"
description = "Markdown highlighting, and a preview of the rendered page."
author = "Flareite"
icon = "icon.svg"
api_version = "1"
entrypoint = "target/wasm32-unknown-unknown/release/markdown.wasm"

[engines]
flareite = ">=0.1.0"

# To read the document it previews.
[permissions]
documents_read = true

[build]
command = "cargo"
args = ["build", "--release"]
watch = ["src", "Cargo.toml"]

[[commands]]
id = "flareite.markdown.preview"
title = "Open Preview"

[[commands]]
id = "flareite.markdown.previewToSide"
title = "Open Preview to the Side"

[[keybindings]]
command = "flareite.markdown.preview"
key = "mod+shift+v"
when = "editorFocus"

[[keybindings]]
command = "flareite.markdown.previewToSide"
key = "mod+k v"
when = "editorFocus"

# The tab the preview shows in; the extension fills it in.
[[previews]]
id = "preview"
icon = "book"

[[languages]]
id = "markdown"
name = "Markdown"
file_extensions = ["md", "markdown", "mdown", "mkd", "mkdn"]
# Built from tree-sitter-markdown 0.5.3; exports `tree_sitter_markdown`.
grammar = "grammars/tree-sitter-markdown.wasm"
highlights = "queries/markdown/highlights.scm"
folds = "queries/markdown/folds.scm"
# Highlights inline text with markdown_inline, and code fences as their
# language.
injections = "queries/markdown/injections.scm"
# Markdown has no comments of its own; HTML comments work in it.
block_comment = ["<!--", "-->"]

# The text inside paragraphs, headings, and table cells, which the Markdown
# grammar leaves to this one. It has no files of its own.
[[languages]]
id = "markdown_inline"
name = "Markdown (inline)"
grammar = "grammars/tree-sitter-markdown_inline.wasm"
highlights = "queries/markdown_inline/highlights.scm"
injections = "queries/markdown_inline/injections.scm"
